<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radyoloji Sözlü Kartları</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Archivo:wght@600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: sakin, klinik, okuma odası – sınav öncesi odak
   IDEA: negatoskop (ışıklı film panosu): karanlık oda, ışıklı film kartı
   PICTURE: kartın kendisi – üstte ışıklı film, altında bulgular
   COLOUR+TYPE: okuma odası lacivert-siyah zemin, film beyazı kart, camgöbeği vurgu; Archivo başlık, Atkinson Hyperlegible metin
   LAYOUT: üstte deste/tür filtreleri, ortada tek kart, altta puanlama; iPad dikey için tek sütun */
:root{color-scheme:light dark;
--bg:light-dark(#e9edf0,#0c1116);--panel:light-dark(#ffffff,#151c24);--ink:light-dark(#141a20,#e8edf1);--mute:light-dark(#5b6670,#8c99a5);
--card:light-dark(#ffffff,#1b232d);--line:light-dark(#d3dae0,#2a3541);--acc:#14a3a0;--accInk:light-dark(#0b6f6d,#5fd6cf);
--bad:#e0533d;--mid:#e0a020;--good:#2fa86a;--film:#05080b}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Atkinson Hyperlegible",system-ui,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer}
header{padding:18px max(4vw,14px) 8px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:end;justify-content:space-between}
h1{font:800 clamp(26px,4vw,38px)/1.05 Archivo,sans-serif;margin:0;letter-spacing:-.01em}
h1 span{color:var(--accInk)}
.stat{font-size:14px;color:var(--mute)}
.stat b{color:var(--ink)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;width:min(260px,60vw);margin-top:6px;display:flex}
.bar i{display:block;height:100%}
nav{padding:4px max(4vw,14px) 0}
.row{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 13px;font-size:15px;min-height:40px}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.chip small{opacity:.7;margin-left:4px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 4px}
.tools input{flex:1 1 200px;font-size:16px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);min-height:44px}
.tools select{font-size:16px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);min-height:44px}
main{padding:8px max(4vw,14px) 40px;max-width:980px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 12px 30px -18px rgba(0,0,0,.45)}
.top{display:flex;justify-content:space-between;gap:8px;padding:12px 16px 0;font-size:14px;color:var(--mute)}
.kind{font-weight:700;color:var(--accInk)}
.kind.OSCE{color:#c0462f}.kind.Endikasyon{color:#8a63c9}
.q{font:700 clamp(19px,2.4vw,23px)/1.35 "Atkinson Hyperlegible",sans-serif;padding:8px 16px 4px;margin:0}
.case{padding:8px 16px;font-size:18px}
.film{background:var(--film);display:flex;justify-content:center;cursor:zoom-in;position:relative}
.film img{max-width:100%;max-height:min(62vh,640px);display:block}
.film .tag{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.6);color:#fff;font-size:13px;padding:3px 9px;border-radius:6px}
.cap{padding:10px 16px 0;color:var(--accInk);font-weight:700;font-size:15px}
.leg{background:#14161b;margin:8px 0 0;padding:8px 16px;font-size:16px;line-height:1.45}
.leg div{margin:4px 0}
.ans{padding:10px 16px 14px;border-top:1px dashed var(--line);margin-top:10px}
.ans b{color:var(--ink)}
.ans .lbl,.step .lbl{font-size:13px;color:var(--mute);font-weight:700;display:block;margin-bottom:2px}
.step{padding:10px 16px;border-top:1px solid var(--line)}
.step .sq{font-weight:700}
.step .sa{margin-top:6px;padding:8px 12px;border-left:4px solid var(--acc);background:color-mix(in srgb,var(--acc) 9%,transparent);border-radius:0 8px 8px 0}
.act{display:flex;gap:8px;padding:12px 16px 16px;flex-wrap:wrap}
.big{flex:1 1 140px;min-height:52px;border-radius:12px;border:0;font-weight:700;font-size:17px;background:var(--acc);color:#fff}
.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.rate{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:0 16px 16px}
.rate button{min-height:52px;border-radius:12px;border:0;color:#fff;font-weight:700;font-size:16px}
.r0{background:var(--bad)}.r1{background:var(--mid)}.r2{background:var(--good)}
.navb{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px}
.navb button{min-height:46px;min-width:110px;border-radius:12px;border:1px solid var(--line);background:var(--panel)}
.pos{color:var(--mute);font-size:15px}
.empty{padding:40px 16px;text-align:center;color:var(--mute)}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center;z-index:9;cursor:zoom-out;padding:10px}
#zoom img{max-width:100%;max-height:100%}
#zoom.on{display:flex}
.hint{color:var(--mute);font-size:14px;padding:0 16px 8px}
.foot{font-size:13px;color:var(--mute);text-align:center;margin-top:22px}
kbd{border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:12px}
@media(max-width:600px){.top{font-size:13px}.navb button{min-width:84px}}
@media(prefers-reduced-motion:no-preference){.card{animation:in .22s ease-out}@keyframes in{from{opacity:.4;transform:translateY(6px)}}}
</style>
</head>
<body>
<header>
  <div><h1>Radyoloji <span>sözlü kartları</span></h1>
  <div class="stat" id="stat">yükleniyor…</div></div>
  <div><div class="stat" id="stat2"></div><div class="bar" id="bar"></div></div>
</header>
<nav>
  <div class="row" id="kinds"></div>
  <div class="row" id="decks"></div>
  <div class="tools">
    <input id="search" type="search" placeholder="Kartlarda ara (ör. Wells, BIRADS 3, Graves)" aria-label="Ara">
    <select id="mode" aria-label="Kart seçimi">
      <option value="all">Tüm kartlar</option>
      <option value="due">Bilmediklerim + yeni</option>
      <option value="bad">Sadece "bilmiyorum"</option>
    </select>
    <button class="chip" id="shuf" aria-pressed="true">Karıştır</button>
    <button class="chip" id="reset">İlerlemeyi sıfırla</button>
  </div>
</nav>
<main>
  <div id="view"></div>
  <div class="navb"><button id="prev">← Önceki</button><span class="pos" id="pos"></span><button id="next">Sonraki →</button></div>
  <p class="foot">Görüntüler hocaların slaytlarından; renkli işaretler ve açıklamalar sonradan eklendi. <kbd>Boşluk</kbd> çevir · <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> puanla · <kbd>←</kbd><kbd>→</kbd> gezin · görüntüye dokun: büyüt</p>
</main>
<div id="zoom"><img alt=""></div>
<script>
{
const KINDS=["Sözlü","Görsel","OSCE","Endikasyon"];
const KLAB={"Sözlü":"Sözlü soru","Görsel":"Görsel – ne görüyorsun?","OSCE":"OSCE olgu","Endikasyon":"Endikasyon / klinik"};
let CARDS=[],list=[],idx=0,shown=0,hintOn=false;
let selK=new Set(KINDS),selD=new Set();
const st={get(){try{return JSON.parse(localStorage.getItem("rk_prog")||"{}")}catch(e){return {}}},
  set(o){try{localStorage.setItem("rk_prog",JSON.stringify(o))}catch(e){}}};
let prog=st.get();
const $=s=>document.querySelector(s);
const strip=h=>h.replace(/<[^>]+>/g,"");
const text=c=>strip([c.q,c.a,c.case,c.cap,(c.steps||[]).flat().join(" "),(c.leg||[]).map(l=>l.t).join(" ")].join(" ")).toLocaleLowerCase("tr");
function decks(){const m={};CARDS.forEach(c=>m[c.deck]=(m[c.deck]||0)+1);return Object.entries(m)}
function chips(){
  $("#kinds").innerHTML=KINDS.map(k=>`<button class="chip" data-k="${k}" aria-pressed="${selK.has(k)}">${KLAB[k]}<small>${CARDS.filter(c=>c.kind==k).length}</small></button>`).join("");
  const all=selD.size==0;
  $("#decks").innerHTML=`<button class="chip" data-d="*" aria-pressed="${all}">Tüm konular</button>`+
    decks().map(([d,n])=>`<button class="chip" data-d="${d}" aria-pressed="${selD.has(d)}">${d}<small>${n}</small></button>`).join("");
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function build(keep){
  const q=$("#search").value.trim().toLocaleLowerCase("tr"),mode=$("#mode").value;
  const cur=list[idx]&&list[idx].id;
  list=CARDS.filter(c=>selK.has(c.kind)&&(selD.size==0||selD.has(c.deck))&&(!q||text(c).includes(q))&&
    (mode=="all"||(mode=="due"&&(prog[c.id]===undefined||prog[c.id]<2))||(mode=="bad"&&prog[c.id]===0)));
  if($("#shuf").getAttribute("aria-pressed")=="true")shuffle(list);
  idx=keep?Math.max(0,list.findIndex(c=>c.id==cur)):0;
  shown=0;hintOn=false;render();stats();
}
function stats(){
  const n=CARDS.length,v=Object.values(prog),g=v.filter(x=>x==2).length,m=v.filter(x=>x==1).length,b=v.filter(x=>x==0).length;
  $("#stat").innerHTML=`<b>${n}</b> kart · ${CARDS.filter(c=>c.img).length} görüntülü`;
  $("#stat2").innerHTML=`<span style="color:var(--good)">● biliyorum ${g}</span> · <span style="color:var(--mid)">● zor ${m}</span> · <span style="color:var(--bad)">● bilmiyorum ${b}</span>`;
  $("#bar").innerHTML=`<i style="width:${g/n*100}%;background:var(--good)"></i><i style="width:${m/n*100}%;background:var(--mid)"></i><i style="width:${b/n*100}%;background:var(--bad)"></i>`;
}
const film=(src,tag)=>`<div class="film" data-z="${src}"><img src="${src}" alt="Slayt görüntüsü" loading="lazy">${tag?`<span class="tag">${tag}</span>`:""}</div>`;
const legend=c=>c.leg&&c.leg.length?`<div class="leg">${c.leg.map(l=>`<div style="color:${l.c}"><b>(${l.n})</b> ${l.t}</div>`).join("")}</div>`:"";
const rateBox=()=>`<div class="rate"><button class="r0" data-r="0">Bilmiyorum</button><button class="r1" data-r="1">Zor</button><button class="r2" data-r="2">Biliyorum</button></div>`;
function render(){
  const v=$("#view");
  if(!list.length){v.innerHTML=`<div class="card empty">Bu filtrede kart yok. Filtreleri genişlet ya da modu "Tüm kartlar" yap.</div>`;$("#pos").textContent="";return}
  const c=list[idx];$("#pos").textContent=`${idx+1} / ${list.length}`;
  const p=prog[c.id],pl=p===undefined?"yeni":["bilmiyorum","zor","biliyorum"][p];
  let h=`<div class="card"><div class="top"><span class="kind ${c.kind}">${KLAB[c.kind]}</span><span>${c.deck} · ${pl}</span></div>`;
  if(c.kind=="OSCE"){
    h+=`<div class="case"><span class="lbl" style="font-size:13px;color:var(--mute);font-weight:700">OLGU</span><br>${c.case}</div>`;
    if(c.front)h+=film(shown>0?c.img:c.front,shown>0&&c.img!=c.front?"işaretli":"")+(shown>0?`<div class="cap">${c.cap}</div>`+legend(c):"");
    c.steps.forEach((s,i)=>{if(i>shown)return;
      h+=`<div class="step"><span class="lbl">ADIM ${i+1} / ${c.steps.length}</span><div class="sq">${s[0]}</div>${i<shown?`<div class="sa">${s[1]}</div>`:""}</div>`});
    if(shown<c.steps.length)h+=`<div class="act"><button class="big" id="flip">Cevabı göster</button></div>`;
    else h+=rateBox();
  }else if(c.kind=="Görsel"){
    h+=`<p class="q">Bu görüntüde ne görüyorsun? Tanın ne, sonra ne istersin?</p>`;
    h+=film(shown?c.img:c.front,shown?"işaretli":"");
    if(!shown){h+=hintOn?`<div class="cap">İpucu: ${c.cap}</div>`:"";
      h+=`<div class="act"><button class="big" id="flip">Bulguları göster</button>${hintOn?"":`<button class="big ghost" id="hint">İpucu (başlık)</button>`}</div>`}
    else h+=`<div class="cap">${c.cap}</div>${legend(c)}<div style="height:12px"></div>`+rateBox();
  }else{
    h+=`<p class="q">${c.q}</p>`;
    if(c.img)h+=film(shown?c.img:(c.front||c.img),shown&&c.front!=c.img?"işaretli":"");
    if(!shown)h+=`<div class="act"><button class="big" id="flip">Cevabı göster</button></div>`;
    else h+=(c.img?`<div class="cap">${c.cap}</div>${legend(c)}`:"")+`<div class="ans"><span class="lbl">CEVAP</span>${c.a}</div>`+rateBox();
  }
  v.innerHTML=h+`</div>`;
}
function flip(){const c=list[idx];if(!c)return;
  if(c.kind=="OSCE"){if(shown<c.steps.length){shown++;render()}}
  else if(!shown){shown=1;render()}}
function go(d){if(!list.length)return;idx=(idx+d+list.length)%list.length;shown=0;hintOn=false;render();window.scrollTo({top:$("main").offsetTop-8})}
function rate(r){const c=list[idx];prog[c.id]=r;st.set(prog);stats();go(1)}
document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-z]");if(!t)return;
  if(t.dataset.k){selK.has(t.dataset.k)?selK.delete(t.dataset.k):selK.add(t.dataset.k);if(!selK.size)KINDS.forEach(k=>selK.add(k));chips();build()}
  else if(t.dataset.d){if(t.dataset.d=="*")selD.clear();else selD.has(t.dataset.d)?selD.delete(t.dataset.d):selD.add(t.dataset.d);chips();build()}
  else if(t.dataset.r)rate(+t.dataset.r);
  else if(t.dataset.z){$("#zoom img").src=t.dataset.z;$("#zoom").classList.add("on")}
  else if(t.id=="flip")flip();
  else if(t.id=="hint"){hintOn=true;render()}
  else if(t.id=="prev")go(-1);else if(t.id=="next")go(1);
  else if(t.id=="shuf"){t.setAttribute("aria-pressed",t.getAttribute("aria-pressed")=="true"?"false":"true");build()}
  else if(t.id=="reset"){if(t.dataset.sure){prog={};st.set(prog);t.textContent="İlerlemeyi sıfırla";delete t.dataset.sure;build()}else{t.dataset.sure=1;t.textContent="Emin misin? Tekrar bas"}}
});
$("#zoom").addEventListener("click",()=>$("#zoom").classList.remove("on"));
$("#search").addEventListener("input",()=>build());
$("#mode").addEventListener("change",()=>build());
document.addEventListener("keydown",e=>{if(e.target.tagName=="INPUT"||e.target.tagName=="SELECT")return;
  if(e.key==" "){e.preventDefault();flip()}else if(e.key=="ArrowRight")go(1);else if(e.key=="ArrowLeft")go(-1);
  else if("123".includes(e.key)&&e.key.length==1&&$(".rate"))rate(+e.key-1);else if(e.key=="Escape")$("#zoom").classList.remove("on")});
let sx=null;$("#view").addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
$("#view").addEventListener("touchend",e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>70)go(dx<0?1:-1);sx=null});
fetch("cards.json").then(r=>r.json()).then(d=>{CARDS=d;chips();build()}).catch(()=>{$("#view").innerHTML=`<div class="card empty">Kartlar yüklenemedi.</div>`});
}
</script>
</body>
</html>
